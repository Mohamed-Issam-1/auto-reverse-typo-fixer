[workspace]
resolver = "2"
members = ["crates/arf-core", "crates/arf-win", "crates/arf-dictc"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/OWNER/auto-reverse-typo-fixer"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
